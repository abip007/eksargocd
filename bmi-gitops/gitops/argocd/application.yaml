# Argo CD Application: keeps namespace bmi-app equal to gitops/bmi-app/ on branch main.
# Replace abip007/eks-managed-terraform with your repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bmi-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the Application deletes its resources
spec:
  project: default
  source:
    repoURL: https://github.com/abip007/eks-managed-terraform.git
    targetRevision: main
    path: gitops/bmi-app
  destination:
    server: https://kubernetes.default.svc
    namespace: bmi-app
  syncPolicy:
    automated:
      prune: true      # delete objects removed from Git
      selfHeal: true   # undo manual kubectl changes
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  # The DB secrets are created by hand (never in Git) - Argo CD doesn't own them.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas   # HPA-managed
