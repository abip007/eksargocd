# <ACCOUNT_ID> and <TAG> are filled in once with sed (guide Step 3); CI then updates the tag.
# Tier 1 — React SPA on nginx (proxies /api to bmi-backend-svc).
# Changes vs repo: Service is ClusterIP (the ALB reaches pod IPs), no imagePullSecrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmi-frontend
  namespace: bmi-app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bmi-frontend
  template:
    metadata:
      labels:
        app: bmi-frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: bmi-frontend } }
      containers:
        - name: bmi-frontend
          image: 014882039467.dkr.ecr.ap-south-1.amazonaws.com/bmi-frontend:37abd74-193255
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bmi-frontend-svc
  namespace: bmi-app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: bmi-frontend
  ports:
    - port: 80
      targetPort: 80
