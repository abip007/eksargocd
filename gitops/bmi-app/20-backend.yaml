# Tier 2 — Node.js API. <ACCOUNT_ID> and bmi.bestclick.click are filled in once with sed (guide Step 3); CI then updates <TAG>.
# Changes vs repo: no imagePullSecrets (EKS nodes pull from ECR with their IAM role),
# FRONTEND_URL = your HTTPS host (CORS), HPA added.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: bmi-app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  NODE_ENV: "production"
  PORT: "3000"
  FRONTEND_URL: "https://bmi.bestclick.click"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmi-backend
  namespace: bmi-app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # no 'replicas': the HPA owns it (otherwise Argo CD and the HPA fight)
  selector:
    matchLabels:
      app: bmi-backend
  template:
    metadata:
      labels:
        app: bmi-backend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: bmi-backend } }
      containers:
        - name: bmi-backend
          image: 014882039467.dkr.ecr.ap-south-1.amazonaws.com/bmi-backend:37abd74-193255
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: backend-secret
            - configMapRef:
                name: backend-config
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bmi-backend-svc        # nginx.conf proxies /api to this name
  namespace: bmi-app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: bmi-backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bmi-backend
  namespace: bmi-app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bmi-backend }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
